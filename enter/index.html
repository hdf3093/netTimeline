<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>net.timeline</title>
    <link rel="stylesheet" href="/enter/gate.css?v=4">
    <link rel="stylesheet" href="/enter/desktop.css?v=4">
    <script src="/session/session.js" data-portal="index" data-page="gate"></script>
</head>
<body>
    <main class="desktop" id="desktop">
        <div class="icons" id="icons"></div>

        <section class="browser" id="browser" aria-label="Browser">
            <div class="b-tabstrip">
                <div class="b-tabs" id="btabs"></div>
                <div class="b-newtab" aria-hidden="true"></div>
                <div class="b-winctl">
                    <button type="button" id="bMin" aria-label="Minimize">_</button>
                    <button type="button" id="bMax" aria-label="Maximize">□</button>
                    <button type="button" id="bClose" class="b-close" aria-label="Close">×</button>
                </div>
            </div>
            <div class="b-toolbar">
                <button type="button" class="b-nav" id="bBack" aria-label="Back">◀</button>
                <button type="button" class="b-nav" id="bFwd" aria-label="Forward">▶</button>
                <button type="button" class="b-nav" id="bReload" aria-label="Reload">↻</button>
                <div class="b-omnibox"><span id="bUrl"></span><span class="b-star" aria-hidden="true">☆</span></div>
            </div>
            <div class="b-view" id="bview"></div>
        </section>

        <div class="balloon" id="balloon" hidden>
            <button type="button" class="balloon-x" id="balloonClose" aria-label="Close">×</button>
            <p class="balloon-title" id="balloonTitle"></p>
            <p id="balloonText">you are being remembered. read the board, or double-click a portal on the desktop to step inside.</p>
        </div>

        <nav class="startmenu" id="startmenu" hidden aria-label="Start menu">
            <p class="startmenu-user" id="startUser"></p>
            <div class="startmenu-items" id="startItems"></div>
            <button type="button" class="startmenu-shutdown" id="shutdown">Shut down…</button>
        </nav>
    </main>

    <footer class="taskbar" id="taskbar">
        <button type="button" class="start" id="startBtn" aria-expanded="false">net.timeline</button>
        <div class="tasks" id="tasks"></div>
        <div class="tray"><span id="clock"></span></div>
    </footer>

    <script src="/enter/gate.js?v=4"></script>
    <script src="/enter/desktop.js?v=5"></script>
</body>
</html>
