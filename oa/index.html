<!DOCTYPE html>
<html lang="en" data-theme="yotsuba">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects / Art — net.timeline</title>
    <link rel="stylesheet" href="/4chan.css">
    <style>
        .cross-container {
            display: grid;
            grid-template-columns: repeat(3, 240px);
            grid-template-rows: repeat(5, 240px);
            justify-content: center;
            align-items: center;
            gap: 0;
            margin: 32px auto 0;
        }

        .cross-container > * {
            display: block;
            width: 240px;
            height: 240px;
            overflow: hidden;
        }

        .cross-container > *:nth-child(1) { grid-column: 2; grid-row: 1; }
        .cross-container > *:nth-child(2) { grid-column: 2; grid-row: 2; }
        .cross-container > *:nth-child(3) { grid-column: 2; grid-row: 3; }
        .cross-container > *:nth-child(4) { grid-column: 1; grid-row: 3; }
        .cross-container > *:nth-child(5) { grid-column: 3; grid-row: 3; }
        .cross-container > *:nth-child(6) { grid-column: 2; grid-row: 4; }
        .cross-container > *:nth-child(7) { grid-column: 2; grid-row: 5; }

        .cross-container img {
            width: 240px;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .oa-placeholder {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(128,128,128,0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            font-size: 9px;
            letter-spacing: 0.14em;
            color: currentColor;
            opacity: 0.28;
            background: rgba(128,128,128,0.02);
            gap: 6px;
        }

        .oa-placeholder::before {
            content: '[ ]';
            font-size: 16px;
            opacity: 0.5;
        }

        .oa-quote {
            text-align: center;
            margin: 20px auto 4px;
            font-size: 13px;
            font-style: italic;
            max-width: 480px;
            line-height: 1.65;
        }

        .oa-source {
            text-align: center;
            font-size: 9px;
            letter-spacing: 0.16em;
            opacity: 0.4;
            font-family: monospace;
            margin-bottom: 0;
        }
    </style>
</head>
