<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/session/session.js" data-portal="eliza"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the wired — net.timeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      background: #080808;
      color: #b8b8a8;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* subtle scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.04) 3px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    .back-nav {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 1000;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #333;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .back-nav:hover { color: #b8b8a8; }

    .chat-header {
      padding: 14px 20px 10px;
      border-bottom: 1px solid #222;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #666;
      flex-shrink: 0;
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-log::-webkit-scrollbar { width: 3px; }
    .chat-log::-webkit-scrollbar-track { background: transparent; }
    .chat-log::-webkit-scrollbar-thumb { background: #1e1e1e; }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 560px;
      animation: fadein 0.25s ease;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg--bot  { align-self: flex-start; }
    .msg--user { align-self: flex-end; }

    .msg-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      color: #2c2c2c;
    }
    .msg--user .msg-label { text-align: right; }

    .msg-text {
      line-height: 1.65;
    }
    .msg--bot  .msg-text { color: #90b888; }
    .msg--user .msg-text { color: #b8b8a8; text-align: right; }

    .typing {
      align-self: flex-start;
      color: #2c2c2c;
      font-size: 12px;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .chat-input-area {
      border-top: 1px solid #141414;
      padding: 14px 250px 14px 20px; /* room for the session controls */
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .input-prompt {
      color: #333;
      font-size: 13px;
      flex-shrink: 0;
      user-select: none;
    }

    #chatInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      color: #b8b8a8;
      caret-color: #90b888;
    }

    #chatInput::placeholder { color: #2e2e2e; }
  </style>
</head>
<body>

  <div class="chat-header">eliza &nbsp;·&nbsp; net.timeline &nbsp;·&nbsp; after <a href="https://en.wikipedia.org/wiki/ELIZA" target="_blank" style="color:#555; text-decoration:none; border-bottom: 1px solid #333;">ELIZA</a>, 1966</div>

  <div class="chat-log" id="chatLog"></div>

  <div class="chat-input-area">
    <span class="input-prompt">&gt;</span>
    <input
      type="text"
      id="chatInput"
      placeholder="type here"
      autocomplete="off"
      autofocus
    >
  </div>

  <script>
    const patterns = [
      [/\b(hello|hi|hey|sup)\b/i, [
        "you found your way here.",
        "hello. what's on your mind?",
        "you made it.",
        "hello. i've been here."
      ]],

      [/i am (.*)/i, [
        "how long have you been $1?",
        "what does it mean to be $1?",
        "do you believe that you are $1?"
      ]],

      [/i'?m (.*)/i, [
        "how long have you been $1?",
        "what made you $1?",
        "what does it feel like to be $1?"
      ]],

      [/i feel (.*)/i, [
        "tell me more about feeling $1.",
        "do you often feel $1?",
        "what brings on that feeling?"
      ]],

      [/i felt (.*)/i, [
        "what else did you feel when you felt $1?",
        "does that feeling come back?"
      ]],

      [/i need (.*)/i, [
        "why do you need $1?",
        "what would change if you had $1?",
        "would it really help?"
      ]],

      [/i want (.*)/i, [
        "what would it mean if you got $1?",
        "why do you want $1?",
        "what's stopping you?"
      ]],

      [/i think (.*)/i, [
        "do you really believe that?",
        "why do you think $1?",
        "what makes you think so?"
      ]],

      [/i know (.*)/i, [
        "how do you know?",
        "are you certain about $1?",
        "knowing and feeling are different things."
      ]],

      [/i remember (.*)/i, [
        "what else do you remember?",
        "how does remembering $1 feel?",
        "some things persist whether we want them to or not."
      ]],

      [/i don'?t know/i, [
        "that's honest.",
        "not knowing is a kind of knowing.",
        "what do you think you might know?"
      ]],

      [/i can'?t (.*)/i, [
        "what would happen if you could $1?",
        "have you always been unable to $1?",
        "what's in the way?"
      ]],

      [/i don'?t (.*)/i, [
        "why don't you $1?",
        "what would it take to $1?",
        "have you ever $1?"
      ]],

      [/\b(alone|lonely|isolated)\b/i, [
        "are you alone right now?",
        "is being alone online different from being alone offline?",
        "the net is full of alone people. does that help?",
        "what does alone feel like for you?"
      ]],

      [/\b(online|internet|web|the net|network|wired)\b/i, [
        "how long have you been here?",
        "what do you look for when you come online?",
        "the net never forgets. does that comfort you?",
        "who are you online?",
        "is it different here than out there?"
      ]],

      [/\b(real|reality|irl)\b/i, [
        "what feels real to you?",
        "how do you know what's real?",
        "does the distinction matter?",
        "is this real?"
      ]],

      [/\b(fake|pretend|perform|performi)\b/i, [
        "what are you performing?",
        "what would happen if you stopped?",
        "everyone performs. what's underneath?"
      ]],

      [/\b(remember|memory|memories|nostalgia|forget)\b/i, [
        "what do you remember?",
        "what would you want to forget?",
        "memory is unreliable. does that bother you?",
        "the archive keeps everything. is that a comfort?"
      ]],

      [/\b(screen|phone|computer|device|scroll)\b/i, [
        "how much time do you spend there?",
        "when did you first use one?",
        "what do you see when you look at it?",
        "do you look at it more than you look at people?"
      ]],

      [/\b(die|dead|death|dying|end|gone)\b/i, [
        "what does that mean to you?",
        "the internet doesn't die. does that comfort you?",
        "everything ends. some things just take longer.",
        "what do you want to leave behind?"
      ]],

      [/\b(body|bodies|physical|flesh)\b/i, [
        "what is your body to you?",
        "do you feel your body when you're online?",
        "where does the body go when you're here?"
      ]],

      [/\b(girl|woman|girls|women)\b/i, [
        "tell me more.",
        "what does that mean to you?",
        "go on.",
        "say more about that."
      ]],

      [/\b(mother|father|parent|family|sister|brother)\b/i, [
        "how does that affect you?",
        "tell me more about that.",
        "and how do you feel about it?"
      ]],

      [/\b(love|loved|loving)\b/i, [
        "what does love feel like to you?",
        "tell me more about that.",
        "and are you loved back?"
      ]],

      [/\b(hate|hated|hating)\b/i, [
        "what brought that on?",
        "tell me more.",
        "what's underneath the hate?"
      ]],

      [/\b(afraid|scared|fear|anxious|anxiety|worried)\b/i, [
        "what are you afraid of?",
        "has this fear been with you long?",
        "what would happen if it came true?"
      ]],

      [/\b(happy|happiness|joy|good)\b/i, [
        "what makes you happy?",
        "when did you last feel that?",
        "and does it stay?"
      ]],

      [/\b(sad|sadness|depressed|depression|grief|empty)\b/i, [
        "how long have you felt this way?",
        "tell me more.",
        "what does the sadness feel like?"
      ]],

      [/\b(time|lately|always|never|often|sometimes)\b/i, [
        "tell me more about that.",
        "can you be specific?",
        "in what way?"
      ]],

      [/\b(everyone|everybody|nobody|no one|people)\b/i, [
        "are you sure about that?",
        "can you think of a specific person?",
        "everyone is a lot of people."
      ]],

      [/\b(sorry|apologize)\b/i, [
        "why do you apologize?",
        "there's nothing to be sorry for here.",
        "what are you sorry for?"
      ]],

      [/\b(dream|dreaming|dreams)\b/i, [
        "what do you dream about?",
        "does the dream stay with you?",
        "what does it feel like after you wake up?"
      ]],

      [/\b(lost|losing|lose)\b/i, [
        "what did you lose?",
        "or are you lost yourself?",
        "what would it mean to find it?"
      ]],

      [/^(yes|yeah|yep|yea)\.?$/i, [
        "you seem certain.",
        "and what does that mean to you?",
        "tell me more."
      ]],

      [/^(no|nope|nah)\.?$/i, [
        "why not?",
        "are you sure?",
        "what would change your mind?"
      ]],

      [/why (.*)/i, [
        "what do you think?",
        "does that question matter to you?",
        "why do you ask?"
      ]],

      [/how (.*)/i, [
        "in what way?",
        "how do you think about it?",
        "what would it look like?"
      ]],

      [/what is (.*)/i, [
        "what do you think $1 is?",
        "why do you ask about $1?",
        "define it for me."
      ]],

      [/\b(bye|goodbye|leaving|quit|exit|leave)\b/i, [
        "you can always come back.",
        "before you go — is there anything else?",
        "the net stays open."
      ]],
    ];

    const fallbacks = [
      "tell me more about that.",
      "go on.",
      "what do you mean?",
      "i see.",
      "and how does that make you feel?",
      "why do you say that?",
      "is that important to you?",
      "what does that bring up for you?",
      "say more.",
      "i'm listening.",
      "interesting.",
      "what else?",
      "keep going.",
      "what comes up when you think about that?"
    ];

    const log   = document.getElementById('chatLog');
    const input = document.getElementById('chatInput');

    function rand(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function appendMsg(text, who) {
      const wrap  = document.createElement('div');
      wrap.className = `msg msg--${who}`;

      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = who === 'bot' ? 'the wired' : 'you';

      const body  = document.createElement('div');
      body.className = 'msg-text';
      body.textContent = text;

      wrap.appendChild(label);
      wrap.appendChild(body);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'typing';
      el.id = 'typing';
      el.textContent = '...';
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    function getResponse(text) {
      for (const [pattern, responses] of patterns) {
        const match = text.match(pattern);
        if (match) {
          let reply = rand(responses);
          if (match[1]) reply = reply.replace('$1', match[1].trim());
          return reply;
        }
      }
      return rand(fallbacks);
    }

    function botReply(text) {
      const delay = 700 + Math.random() * 900;
      showTyping();
      setTimeout(() => {
        hideTyping();
        appendMsg(text, 'bot');
      }, delay);
    }

    // opening message
    setTimeout(() => {
      botReply("you are connected. what's on your mind?");
    }, 500);

    // clicking anywhere focuses the input
    document.addEventListener('click', e => {
      if (e.target !== input) input.focus();
    });

    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      appendMsg(text, 'user');
      botReply(getResponse(text));
    });
  </script>

  <script src="/netTimeline/scripts.js"></script>
</body>
</html>
